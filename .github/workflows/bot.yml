name: Rinaldo Scout Bot

on:
  schedule:
    # Ogni venerdì alle 10:00 italiane circa
    # GitHub Actions usa UTC
    # 08:00 UTC = 10:00 Italia (ora legale)
    - cron: "0 8 * * 5"

  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: npm start
