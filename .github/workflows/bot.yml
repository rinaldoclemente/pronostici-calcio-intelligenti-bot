name: Invio Pronostici

on:
  schedule:
    # 🌍 Mondiali → ogni giorno alle 10:00
    - cron: "0 10 * * *"

    # ⚽ Campionati → ogni venerdì alle 10:00
    # cron: "0 10 * * 5"

  workflow_dispatch:
    inputs:
      TEST_MODE:
        description: "Attiva modalità test (true/false)"
        required: false
        default: "false"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - run: node bot.js
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TEST_MODE: ${{ github.event.inputs.TEST_MODE }}
