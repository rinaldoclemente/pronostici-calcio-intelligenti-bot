name: Telegram Bot

on:
  workflow_dispatch:
    inputs:
      TEST_MODE:
        description: "Attiva modalità test (true/false)"
        required: false
        default: "false"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Run bot
        run: node bot.js
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TEST_MODE: ${{ github.event.inputs.TEST_MODE }}
