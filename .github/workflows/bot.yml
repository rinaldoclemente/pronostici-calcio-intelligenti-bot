name: Telegram Bot

on:
  schedule:
    - cron: "0 8 * * 5"   # venerdì (campionati)
    - cron: "0 8 * * *"   # ogni giorno (mondiali)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - run: node bot.js
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
