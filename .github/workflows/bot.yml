name: Invio Pronostici

on:
  schedule:
    # Giovedì ore 12:00 Italia circa in ora legale (10:00 UTC)
    - cron: "0 10 * * 4"

  workflow_dispatch:
    inputs:
      TEST_MODE:
        description: "Attiva modalità test (true/false)"
        required: false
        default: "false"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run bot
        run: node bot.js
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TEST_MODE: ${{ github.event.inputs.TEST_MODE || 'false' }}
          TIMEZONE: Europe/Rome
          TEAM_FORM_N: 10
          TOP_LIMIT: 10
          SHOW_NUMBERS: false
